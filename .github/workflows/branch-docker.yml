name: Build branch Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push branch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          BRANCH_TAG=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//' | cut -c1-80)
          if [ -z "$BRANCH_TAG" ]; then
            BRANCH_TAG="branch"
          fi
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          VERSION="branch-${BRANCH_TAG}-${SHORT_SHA}"
          echo "$VERSION" > VERSION
          echo "GHCR_REPOSITORY=${REPO}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=branch-${BRANCH_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA_TAG=branch-${BRANCH_TAG}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ env.IMAGE_SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Branch Docker Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GHCR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GHCR_REPOSITORY}:${IMAGE_SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
