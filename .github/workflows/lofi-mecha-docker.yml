name: Build lofi-mecha Docker image

on:
  push:
    branches:
      - lofi-mecha
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write VERSION
        run: |
          echo "lofi-mecha-${GITHUB_SHA::7}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/custom-frontend:lofi-mecha
            ghcr.io/${{ github.repository_owner }}/custom-frontend:lofi-mecha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
